name: Deploy License Service

on:
  push:
    branches:
      - licensed
      - codex/edgeone-license-service
    paths:
      - "services/license-service/**"
      - ".github/workflows/deploy-license-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-license-service-production
  cancel-in-progress: false

jobs:
  test:
    name: Test EdgeOne license service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/license-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

  deploy:
    name: Deploy production EdgeOne Node.js Cloud Functions
    if: github.event_name == 'push' || github.ref == 'refs/heads/licensed'
    needs: test
    runs-on: ubuntu-latest
    environment: licensed-production
    defaults:
      run:
        working-directory: services/license-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/license-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy EdgeOne project
        id: deploy
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          DEPLOYMENT_OUTPUT="$(npm run --silent deploy)"
          printf '%s\n' "$DEPLOYMENT_OUTPUT"
          DEPLOYMENT_JSON="$(tail -n 1 <<<"$DEPLOYMENT_OUTPUT")"
          DEPLOYMENT_URL="$(jq -r \
            '.deploymentUrl // .deployment_url // .url // .deployment.url // empty' \
            <<<"$DEPLOYMENT_JSON")"
          test -n "$DEPLOYMENT_URL"
          printf 'deployment_url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and custom domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          node <<'NODE'
          const customOrigin = "https://licensed.xyyamsz.cn";
          const deviceHash = "0".repeat(64);

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function cookies(response) {
            const values = response.headers.getSetCookie?.() ?? [];
            return values.map((value) => value.split(";", 1)[0]).join("; ");
          }

          async function request(url, options = {}) {
            const response = await fetch(url, { redirect: "manual", ...options });
            return { response, body: await response.text(), cookie: cookies(response) };
          }

          async function verifyOrigin(origin, query = "") {
            const health = await request(`${origin}/healthz${query}`);
            assert(health.response.status === 200, `${origin} healthz 状态异常`);
            const healthBody = JSON.parse(health.body);
            assert(healthBody.ok === true && healthBody.runtime === "edgeone-node", `${origin} healthz 内容异常`);

            const activation = await request(`${origin}/api/v1/activate`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                ...(health.cookie ? { cookie: health.cookie } : {}),
              },
              body: JSON.stringify({
                token: "RJM-00000-00000-00000-00000-00000",
                deviceHash,
                platform: "macos",
                version: "1.0.0",
              }),
            });
            assert(activation.response.status === 400, `${origin} 激活接口状态异常`);
            assert(JSON.parse(activation.body).error?.code === "INVALID_TOKEN", `${origin} 激活接口错误码异常`);
          }

          async function assertRedirect(path, expectedLocation) {
            const result = await request(`${customOrigin}${path}`);
            assert(result.response.status === 302, `${path} 未返回 302`);
            assert(result.response.headers.get("location") === expectedLocation, `${path} 跳转地址异常`);
          }

          const deploymentUrl = new URL(process.env.DEPLOYMENT_URL);
          await verifyOrigin(deploymentUrl.origin, deploymentUrl.search);
          await verifyOrigin(customOrigin);
          await assertRedirect("/", "/admin/");
          await assertRedirect("/admin/", "/admin/login");

          const login = await request(`${customOrigin}/admin/api/login`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              origin: customOrigin,
            },
            body: JSON.stringify({ username: "deployment-check", password: "invalid-password-2026" }),
          });
          assert(login.response.status === 401, "管理员登录来源校验异常");
          assert(JSON.parse(login.body).error?.code === "INVALID_CREDENTIALS", "管理员登录错误码异常");
          NODE
