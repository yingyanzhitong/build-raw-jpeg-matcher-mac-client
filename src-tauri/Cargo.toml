[package]
name = "raw-jpeg-matcher"
version = "0.1.47"
description = "A macOS utility for matching selected JPEG files to RAW originals."
authors = ["masongzhi"]
edition = "2021"

[lib]
name = "raw_jpeg_matcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "raw-jpeg-matcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
ab_glyph = "0.2"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
